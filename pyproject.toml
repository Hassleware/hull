[project]
name = "hull"
version = "0.5.0"
description = "Hull: Your own internet culture graph, locally computed to drive a more comprehensive Rudder Youtube filtering system via its gRPC API."
requires-python = ">=3.11"
dependencies = ["grpcio>=1.85", "protobuf>=6.31", "numpy>=2", "pillow>=11", "PySide6>=6.10", "websockets>=13", "grpcio-reflection>=1.85"]

[project.optional-dependencies]
dev = ["grpcio-tools>=1.85"]  # scripts/sync_proto.py

[project.scripts]
hull = "hull.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hull*"]

[tool.setuptools.package-data]
hull = ["assets/*.svg"]
