# Hull's settings. Every Hull stage becomes a stage in Rudder's pipeline.

[rudder]
address = "127.0.0.1:7833"  # Rudder's API, served by Rudder's bridge
start_bridge = true          # if no bridge is running, Hull runs Rudder's bridge itself

[pipeline]
after = "your-clicks"  # Hull's stages go right after this Rudder stage: only your own ratings come first
when_missing = "hide"  # if Hull stops without cleaning up, Rudder hides what Hull would have checked ("pass" to let them through)

[data]
folder = "data"        # hull.db and thumbs/

# A video shown once is never shown again (a Bloom filter of shown ids: data/shown.bloom)
[[stage]]
id = "repeats"
kind = "repeats"

# Your own rules: regular expressions over title, channel, description and thumbnail text. First match decides.
[[stage]]
id = "rules"
kind = "rules"
[stage.config]
rules = [
  # { pattern = "los santos|\bgta ?(v|5|6|online)?\b|grand theft auto", action = "hide", why = "GTA" },
]

# Gemma (in Ollama) names each video's topics into your internet culture graph. Needs Ollama with gemma4:e4b and embeddinggemma.
[[stage]]
id = "internet-culture"
kind = "internet-culture"
[stage.config]
model = "gemma4:e4b"
embed_model = "embeddinggemma"
# block = ["grand theft auto"]        # hide videos near these topics in your internet culture graph (block_at = 0.85)
# focus = ["bayesian statistics"]     # show only videos near these (focus_at = 0.75): a learning harness
# draft_near = 600                     # a goal draft sorts this many topics closest to the goal,
# draft_linked = 300                   # plus up to this many that share their videos

# Learns from your likes and dislikes in Rudder and hides new videos like the ones you disliked (after the internet
# culture stage, which tags them first)
[[stage]]
id = "taste"
kind = "taste"
